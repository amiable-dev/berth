# Example: the policy of the machine berth was built on (2026-09-13), kept as a worked example of
# blocks, declared ports, extras and a shared stack. Do not copy it: run `berth init` and
# `berth project add <path>` to build yours.
#
# port = 10000 + 1000*P + 100*W + R
#   P project 0-29 (hand-assigned)   W worktree 0-9 (0 = main checkout)   R role 00-99

[scheme]
base = 10000
project_max = 29
worktree_max = 9
roles = { web = 0, api = 1, db = 2, cache = 3, smtp = 4, mail-ui = 5, docs = 6, worker = 7, otlp-grpc = 8, otlp-http = 9 }

[pools]
dynamic = "40000-41999"
ttl_hours = 8

[reserved]
ranges = ["0-1023", "4000-4999", "49152-65535"]   # privileged, portless wrapper mode, macOS ephemeral
ports  = [5000, 7000]                              # macOS AirPlay receiver (ControlCenter)
lint   = [11211, 11434, 15672, 16686, 19999, 27017] # well-known defaults inside the block range
ignore_processes = ["Code Helper (Plugin)", "Code - Insiders Helper (Plugin)", "Cursor Helper (Plugin)", "rapportd", "sharingd", "identityservicesd", "tailscaled"] # bind random loopback ports; hidden unless they collide with a lease

[shared.observability]
owner = "skills-telemetry"
ports = { grafana = 3000, langfuse = 3001, tempo = 3200, otlp-grpc = 4317, otlp-http = 4318, metrics = 8888, prometheus = 9090 }
note  = "One stack for every project. breach-resolve, standards-telemetry and llm-council carry duplicates that should point here instead."

# ---- projects ---------------------------------------------------------------
# `declared` lists legacy hardcoded ports so conflicts are visible before migration.
# `extras` names role slots 10-99 for repos with more than ten services.

[projects.berth]
P = 0
path = "~/port-visualiser"
note = "The registry itself. Dashboard on 10000."

[projects.skills-telemetry]
P = 1
path = "~/projects/amiable/skills-telemetry"
declared = [5432]

