# Dependabot configuration for automated dependency updates
#
# berth has no runtime dependencies (ADR-005), so the npm ecosystem here is
# the dev toolchain only. Both ecosystems use a 7-day cooldown so that a
# freshly published (and possibly compromised) release is never adopted on
# the day it appears.

version: 2

updates:
  # npm (devDependencies: Biome, TypeScript, Vitest, esbuild, @types/node, smol-toml)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      dev-dependencies:
        dependency-type: "development"
    ignore:
      # @types/node tracks the engine line (Node 20, ADR-005); majors are bumped by hand
      # together with `engines.node`.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # vitest 5 requires Node >= 22.12; take it together with the engine bump.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"

  # CI tools installed from a lockfile (the Claude Code CLI used to validate the plugin)
  - package-ecosystem: "npm"
    directory: "/.github/tools"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"

  # GitHub Actions (pinned by commit SHA; Dependabot updates the SHA and the
  # trailing version comment together)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    cooldown:
      default-days: 7
    labels:
      - "dependencies"
      - "ci"
    commit-message:
      prefix: "chore(ci)"
