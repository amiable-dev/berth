name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least-privilege default; nothing in CI needs to write.
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep a Changelog discipline, enforced: a pull request must touch CHANGELOG.md unless it is
  # from Dependabot or carries the `skip-changelog` label. Required by the main ruleset.
  changelog:
    name: Changelog updated
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Require a CHANGELOG.md change
        env:
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          case "$PR_AUTHOR" in dependabot*) echo "Dependabot PR: exempt"; exit 0 ;; esac
          case ",$PR_LABELS," in *,skip-changelog,*) echo "skip-changelog label: exempt"; exit 0 ;; esac
          if git diff --name-only "$BASE_SHA" "$HEAD_SHA" | grep -qx 'CHANGELOG.md'; then
            echo "CHANGELOG.md updated"
          else
            echo "::error::CHANGELOG.md was not changed. Add a note under [Unreleased], or label the PR skip-changelog."
            exit 1
          fi

  check:
    name: Node ${{ matrix.node }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        node: [20, 22]
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node ${{ matrix.node }}
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint (Biome)
        run: npm run lint

      - name: Typecheck (tsc)
        run: npm run typecheck

      - name: Test (Vitest)
        run: npm test

      - name: Build (esbuild single bundle)
        run: npm run build

      - name: Smoke test the bundle
        run: |
          node dist/berth.js --version
          node dist/berth.js --help

      # Plugin packaging (ADR-007): validate the manifest, hooks and marketplace with the
      # Claude Code CLI on one matrix cell; the plugin tests cover the rest everywhere.
      # The CLI is pinned through .github/tools/package-lock.json (Dependabot keeps it current).
      - name: Validate the Claude Code plugin
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: |
          npm ci --prefix .github/tools
          .github/tools/node_modules/.bin/claude plugin validate . --strict

      # ADR-005: the published package must have no runtime dependencies.
      - name: Assert zero runtime dependencies
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            const pkg = JSON.parse(readFileSync("package.json", "utf8"));
            const deps = Object.keys(pkg.dependencies ?? {});
            if (deps.length > 0) {
              console.error("runtime dependencies present (ADR-005):", deps.join(", "));
              process.exit(1);
            }
            console.log("ok: no runtime dependencies");
          '
