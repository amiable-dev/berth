# Release: stage @amiable-dev/berth on npm for maintainer approval and create the GitHub Release.
#
# Triggered by pushing a tag that starts with "v". Publishing uses npm trusted
# publishing (OIDC): the publish job requests an id-token and npm exchanges it
# for a short-lived credential, so there is no NPM_TOKEN secret anywhere in
# this repository and every release carries a provenance attestation.
#
# The trusted publisher must be configured once on npmjs.com (owner
# amiable-dev, repository berth, workflow release.yml, environment npm); see
# CONTRIBUTING.md, "One-time setup: npm trusted publishing".

name: Release

on:
  push:
    tags:
      - 'v*'

# Least-privilege default; jobs below elevate only the scopes they need.
permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    name: Full check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify the tag matches package.json
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          if [ "$PKG_VERSION" != "$TAG_VERSION" ]; then
            echo "::error::Tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Releasing $PKG_VERSION"

      - name: Lint, typecheck, test, build
        run: npm run check

      - name: Smoke test the bundle
        run: |
          node dist/berth.js --version
          node dist/berth.js --help

  publish:
    name: Stage on npm
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: npm
      url: https://www.npmjs.com/package/@amiable-dev/berth
    permissions:
      contents: read
      id-token: write  # OIDC token for npm trusted publishing and provenance
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020  # v7.0.0
        with:
          node-version: 22
          cache: npm
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm 11.5.1 or later; the npm bundled with
      # Node 22 may be older.
      - name: Update npm
        run: |
          npm install -g npm@11
          npm --version

      - name: Install dependencies
        run: npm ci

      # The check job built on another runner; this job must build its own tarball.
      - name: Build
        run: npm run build

      # Print the OIDC token claims npm will be judged on (no secrets: claims are public
      # facts about this run), so a mismatch with the npmjs.com trusted-publisher form is
      # visible in the log instead of a bare 404.
      - name: Show OIDC claims
        env:
          AUDIENCE: npm:registry.npmjs.org
        run: |
          TOKEN="$(curl -sS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" \
            "${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=${AUDIENCE}" | node -p 'JSON.parse(require("fs").readFileSync(0,"utf8")).value')"
          node -e '
            const [, payload] = process.argv[1].split(".");
            const c = JSON.parse(Buffer.from(payload, "base64url").toString());
            for (const k of ["repository","repository_owner","workflow","workflow_ref","job_workflow_ref","environment","ref","event_name"]) console.log(`${k}: ${c[k] ?? "(absent)"}`);
          ' "$TOKEN"

      # `prepack` runs the build, so the bundle is produced here from the
      # checked-out tag. Prerelease tags (v1.2.0-rc.1) go to the `next`
      # dist-tag so a plain `npm install @amiable-dev/berth` never resolves
      # to one.
      # `--loglevel verbose` makes npm print the registry's reason when an OIDC token
      # exchange is refused; without it a refused publish is a bare 404. npm redacts tokens.
      # Re-running a tag (or tagging a version that was published by hand, as the
      # very first release must be) skips the publish instead of failing on
      # "cannot publish over previously published version".
      - name: Check whether this version is already on the registry
        id: registry
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(node -p "require('./package.json').name")"
          if npm view "${NAME}@${VERSION}" version >/dev/null 2>&1; then
            echo "published=true" >> "$GITHUB_OUTPUT"
            echo "${NAME}@${VERSION} is already published; skipping publish"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
          fi

      # Staged publishing: the trusted publisher on npmjs.com allows `npm stage publish`
      # only, so CI never publishes directly. A maintainer approves the staged release
      # with 2FA (`npm stage approve <stage-id>` or on npmjs.com), and only then does the
      # version go live at the dist-tag chosen here. Staging the same version twice fails,
      # so a re-run before approval reports the error and nothing else changes.
      - name: Stage the release for maintainer approval
        if: steps.registry.outputs.published != 'true'
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NAME="$(node -p "require('./package.json').name")"
          case "$VERSION" in
            *-*) TAG=next ;;
            *)   TAG=latest ;;
          esac
          npm stage publish --provenance --access public --tag "$TAG" --loglevel verbose 2>&1 | tee stage.log
          {
            echo "## npm release staged"
            echo
            echo "\`${NAME}@${VERSION}\` is staged on npmjs.com with dist-tag \`${TAG}\` and a provenance attestation."
            echo "It is **not live** until a maintainer approves it with 2FA:"
            echo
            echo '```bash'
            echo "npm stage list ${NAME}          # find the stage id"
            echo "npm stage approve <stage-id>    # prompts for the one-time password"
            echo '```'
            echo
            echo "or approve it from the package page on npmjs.com."
            grep -i -E "stage(d)? ?id|/-/npm/v1/stage" stage.log | sed 's/^/    /' || true
          } >> "$GITHUB_STEP_SUMMARY"

  release:
    name: GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: write  # to create the release
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      # The release notes are this version's CHANGELOG section: everything
      # from its "## [x.y.z]" heading up to the next "## [" heading or the
      # link references at the end of the file.
      - name: Extract release notes from CHANGELOG.md
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v ver="$VERSION" '
            /^## \[/ { if (found) exit; if (index($0, "## [" ver "]") == 1) found = 1; next }
            /^\[[^]]+\]: / { if (found) exit }
            found { print }
          ' CHANGELOG.md > release-notes.md
          if [ -s release-notes.md ]; then
            echo "Release notes:"
            cat release-notes.md
          else
            echo "::warning::No CHANGELOG.md section found for $VERSION; falling back to generated notes"
          fi

      # No third-party action here: gh targets the repo directly, which keeps
      # this privileged job free of anything but the checkout.
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#v}"
          PRERELEASE=""
          case "$VERSION" in *-*) PRERELEASE="--prerelease" ;; esac
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $TAG already exists, skipping creation"
          elif [ -s release-notes.md ]; then
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "berth $TAG" --notes-file release-notes.md $PRERELEASE
          else
            gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --verify-tag \
              --title "berth $TAG" --generate-notes $PRERELEASE
          fi
