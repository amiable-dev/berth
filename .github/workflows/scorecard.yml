# OpenSSF Scorecard Workflow
# Results are published so the badge and the scorecard.dev viewer work:
# https://scorecard.dev/viewer/?uri=github.com/amiable-dev/berth

name: OpenSSF Scorecard

on:
  # Run on pushes to main
  push:
    branches: [main]
  # Scorecard's own recommended trigger: re-score when branch protection changes
  branch_protection_rule:
  # Run weekly on Saturday at 1:30 AM UTC
  schedule:
    - cron: '30 1 * * 6'
  # Allow manual runs
  workflow_dispatch:

# Read-only permissions at workflow level
permissions: read-all

jobs:
  analysis:
    name: Scorecard Analysis
    runs-on: ubuntu-latest
    permissions:
      # Required for uploading SARIF results
      security-events: write
      # Required for publishing results (OIDC token)
      id-token: write

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false

      - name: Run Scorecard analysis
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc  # v2.4.4
        with:
          results_file: results.sarif
          results_format: sarif
          # Publish results to enable badge and API access
          publish_results: true

      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5

      - name: Upload to code-scanning
        uses: github/codeql-action/upload-sarif@b96794f015dfd88f77b49b1c93e0fa7110f94c63  # v4.38.0
        with:
          sarif_file: results.sarif
