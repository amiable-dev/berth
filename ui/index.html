<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>berth</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./styles.css">
</head>
<body data-theme="dark">
<div class="app">
  <header class="hdr">
    <div class="brand">
      <span class="wordmark">berth</span>
      <span class="bound" id="bound">ui :10000</span>
      <span class="fixture-tag" id="fixtureTag" title="Data is ./fixtures/check.sample.json, not a live berth check" hidden>fixture</span>
    </div>
    <div class="tabs" id="tabs" role="tablist" aria-label="views"></div>
    <div class="spacer"></div>
    <nav class="links" aria-label="project links">
      <a class="btn btn-icon" href="https://amiable-dev.github.io/berth/" target="_blank" rel="noopener noreferrer" title="Documentation" aria-label="Documentation"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M1 2.5A1.5 1.5 0 0 1 2.5 1h4.1c.9 0 1.7.4 2.2 1.1l.2.2.2-.2c.5-.7 1.3-1.1 2.2-1.1h2.1A1.5 1.5 0 0 1 15 2.5v9a1.5 1.5 0 0 1-1.5 1.5h-2.1c-.6 0-1.2.3-1.6.7l-.8.9c-.3.4-.8.4-1.1 0l-.8-.9a2 2 0 0 0-1.6-.7H2.5A1.5 1.5 0 0 1 1 11.5v-9Zm6.5 1.3v9c-.4-.4-1-.7-1.7-.7H2.5v-9h4.1c.5 0 .9.3.9.7Zm1 0c0-.4.4-.7.9-.7h2.1v9h-1.3c-.6 0-1.3.3-1.7.7v-9Z"/></svg></a>
      <a class="btn btn-icon" href="https://github.com/amiable-dev/berth" target="_blank" rel="noopener noreferrer" title="Source on GitHub" aria-label="Source on GitHub"><svg viewBox="0 0 16 16" width="13" height="13" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg></a>
    </nav>
    <input class="search" id="search" type="text" placeholder="search port, project, pid…" aria-label="search port, project, pid" autocomplete="off" spellcheck="false">
    <div class="ctl">
      <span class="dot on" id="dot"></span>
      <span class="ago" id="ago">0s ago</span>
      <button class="btn poll on" id="pollBtn" type="button" title="Poll berth check --json every 5 s" aria-pressed="true">poll on</button>
      <button class="btn" id="refreshBtn" type="button" title="Re-fetch berth check --json now">refresh</button>
      <button class="btn btn-icon" id="themeBtn" type="button" aria-label="toggle light or dark theme">☾</button>
    </div>
  </header>
  <div class="filters" id="filters"></div>
  <div class="body">
    <main class="main" id="main"></main>
    <aside class="drawer" id="drawer" aria-label="port details" hidden></aside>
  </div>
</div>
<div class="tip" id="tip" aria-hidden="true" hidden></div>
<script type="module" src="./app.js"></script>
</body>
</html>
